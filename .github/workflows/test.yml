name: test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Simulate all test programs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the CPU
        uses: actions/checkout@v4

      # The test programs are assembled by the assembler from the upstream
      # QNICE-FPGA project, which is not vendored here.
      #
      # The ref is deliberate, and it is a commit rather than a branch name.
      #
      # This repo follows upstream's "develop", not the default branch --
      # develop is where the ISA this CPU implements is defined (its
      # vhdl/alu.vhd is the reference the flag behaviour in
      # src/cpu_main/sub/alu_flags.vhd was checked against, and its emulator/ is
      # what test/*.asm were cross-checked on). Without any ref,
      # actions/checkout takes the repository default, which is master: 567
      # commits behind develop, with a qasm.c differing by some 300 lines.
      #
      # The two branches have diverged in BOTH directions -- master also carries
      # 22 commits that are not on develop, and its head is the more recent of
      # the two by date -- so "whichever looks newest" picks the wrong one. See
      # the "Which upstream version" section of the top-level README.md.
      #
      # The SHA below is what develop pointed at when this was pinned
      # (2024-04-10, the branch's head since then). Naming the branch instead
      # left CI free to move under us the moment upstream pushed to it, which is
      # exactly the ambiguity the README section exists to remove; the cost is
      # that an upstream assembler fix now needs this line bumped by hand, which
      # is the intended trade. Every test/*.rom happens to come out
      # byte-identical from either branch's assembler today, so this fixes no
      # live bug -- it stops CI and a local checkout silently drifting apart.
      - name: Check out QNICE-FPGA (for the assembler)
        uses: actions/checkout@v4
        with:
          repository: sy2002/QNICE-FPGA
          ref: b1fb36c56508d1237f662f6234b3bfa4142b3432
          path: QNICE-FPGA

      # tools/make-toolchain.sh builds the *whole* QNICE toolchain -- vasm,
      # vbcc, an SDL2-based emulator -- none of which is needed here. The
      # assembler/asm wrapper script only needs these two binaries next to it;
      # the compile flags are lifted from make-toolchain.sh.
      - name: Build the assembler
        run: |
          cd QNICE-FPGA/assembler
          cc qasm.c     -o qasm     -O3 -Wno-unused-result
          cc qasm2rom.c -o qasm2rom -O3 -Wno-unused-result -std=c99

      - name: Install GHDL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghdl
          ghdl --version

      # The entire pass/fail signal rests on GHDL mapping std.env.finish(0)
      # and stop(1) onto the process exit code -- that is how
      # test/test_monitor.vhd reports a verdict. Check it up front, so that an
      # unexpected GHDL build fails loudly here rather than silently reporting
      # every test as green.
      - name: Check GHDL exit-code behaviour
        run: |
          mkdir -p /tmp/ghdl-check
          cd /tmp/ghdl-check
          cat > exit_code.vhd <<'EOF'
          use std.env.all;
          entity exit_code is
             generic (G_FAIL : boolean := false);
          end entity exit_code;
          architecture simulation of exit_code is
          begin
             process
             begin
                if G_FAIL then stop(1); else finish(0); end if;
                wait;
             end process;
          end architecture simulation;
          EOF
          ghdl -a --std=08 exit_code.vhd
          ghdl -e --std=08 exit_code
          rc=0; ghdl -r --std=08 exit_code -gG_FAIL=false || rc=$?
          if [ "$rc" -ne 0 ]; then
             echo "::error::std.env.finish(0) gave exit code $rc, expected 0"
             exit 1
          fi
          rc=0; ghdl -r --std=08 exit_code -gG_FAIL=true || rc=$?
          if [ "$rc" -eq 0 ]; then
             echo "::error::std.env.stop(1) gave exit code 0, expected non-zero"
             exit 1
          fi

      # Each test program ends by writing its own pass/fail verdict, which
      # test/test_monitor.vhd turns into the simulation's exit code, and the
      # log of every register and memory write is diffed against the committed
      # test/*.writes.golden. So a green job here means the CPU behaved exactly
      # as expected, not merely that the simulation ran. See test/README.md.
      - name: Run the test suite
        run: make test ASSEMBLER=$GITHUB_WORKSPACE/QNICE-FPGA/assembler/asm

      # The run above uses a zero-latency memory: every request is accepted
      # the cycle it is presented and answered the next one. That leaves the
      # masters' response bookkeeping -- FETCH's wb_stale counting and
      # MEMORY's op-type FIFO -- barely exercised, and it cannot reach FETCH's
      # bus-cycle teardown path at all, which only runs when a request is
      # stuck on STB against a stalling slave. So run the whole suite again
      # against a memory that is slow in both of the ways a pipelined Wishbone
      # slave can be, on both ports. Nothing is diffed against the golden
      # files here -- the delays change every cycle count -- but each program
      # still writes its own pass/fail verdict, which must not depend on how
      # long the memory takes to answer. See test/wb_dp_mem.vhd's header.
      - name: Run the test suite against a slow memory
        run: make test_slow ASSEMBLER=$GITHUB_WORKSPACE/QNICE-FPGA/assembler/asm

      # On a golden-file mismatch the diff is already in the job log, but the
      # full logs make it much easier to see what moved.
      - name: Upload the write logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: writes-logs
          path: test/*.writes
          if-no-files-found: ignore
