name: test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Simulate all test programs (READ_REG=${{ matrix.read_reg }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Two legs, differing only in how the testbench memory answers:
    #
    #   true  - ordinary pipelined Wishbone slave, ACK a cycle after the
    #           request is accepted. This is the shipping configuration and the
    #           one the synthesised design uses.
    #   false - a zero-latency slave: combinational ACK, read data valid in the
    #           same cycle. This is the only thing that exercises the
    #           same-cycle paths in the two bus masters end to end -- see
    #           src/memory/README.md#Zero-latency-ACKs and
    #           src/fetch/README.md#Zero-latency-ACKs. Formal covers them, but
    #           formal cannot tell you the CPU still runs a program correctly.
    #
    # The two legs share test/*.writes.golden and must produce identical write
    # logs; only the cycle counts differ, and those have their own
    # test/*.stats_zerolat.golden. See test/README.md.
    #
    # This is a matrix rather than a second "make test" step in one job, for
    # two reasons: a failure in one leg must not stop the other from running,
    # since which of the two fails IS the diagnosis; and the two runs write the
    # same test/*.writes paths, so sharing a job would have the second leg
    # overwrite the first's logs before they could be uploaded.
    strategy:
      fail-fast: false
      matrix:
        read_reg: [ 'true', 'false' ]

    steps:
      - name: Check out the CPU
        uses: actions/checkout@v4

      # The test programs are assembled by the assembler from the upstream
      # QNICE-FPGA project, which is not vendored here.
      - name: Check out QNICE-FPGA (for the assembler)
        uses: actions/checkout@v4
        with:
          repository: sy2002/QNICE-FPGA
          path: QNICE-FPGA

      # tools/make-toolchain.sh builds the *whole* QNICE toolchain -- vasm,
      # vbcc, an SDL2-based emulator -- none of which is needed here. The
      # assembler/asm wrapper script only needs these two binaries next to it;
      # the compile flags are lifted from make-toolchain.sh.
      - name: Build the assembler
        run: |
          cd QNICE-FPGA/assembler
          cc qasm.c     -o qasm     -O3 -Wno-unused-result
          cc qasm2rom.c -o qasm2rom -O3 -Wno-unused-result -std=c99

      - name: Install GHDL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghdl
          ghdl --version

      # The entire pass/fail signal rests on GHDL mapping std.env.finish(0)
      # and stop(1) onto the process exit code -- that is how
      # test/test_monitor.vhd reports a verdict. Check it up front, so that an
      # unexpected GHDL build fails loudly here rather than silently reporting
      # every test as green.
      - name: Check GHDL exit-code behaviour
        run: |
          mkdir -p /tmp/ghdl-check
          cd /tmp/ghdl-check
          cat > exit_code.vhd <<'EOF'
          use std.env.all;
          entity exit_code is
             generic (G_FAIL : boolean := false);
          end entity exit_code;
          architecture simulation of exit_code is
          begin
             process
             begin
                if G_FAIL then stop(1); else finish(0); end if;
                wait;
             end process;
          end architecture simulation;
          EOF
          ghdl -a --std=08 exit_code.vhd
          ghdl -e --std=08 exit_code
          rc=0; ghdl -r --std=08 exit_code -gG_FAIL=false || rc=$?
          if [ "$rc" -ne 0 ]; then
             echo "::error::std.env.finish(0) gave exit code $rc, expected 0"
             exit 1
          fi
          rc=0; ghdl -r --std=08 exit_code -gG_FAIL=true || rc=$?
          if [ "$rc" -eq 0 ]; then
             echo "::error::std.env.stop(1) gave exit code 0, expected non-zero"
             exit 1
          fi

      # Each test program ends by writing its own pass/fail verdict, which
      # test/test_monitor.vhd turns into the simulation's exit code, and the
      # log of every register and memory write is diffed against the committed
      # test/*.writes.golden. So a green job here means the CPU behaved exactly
      # as expected, not merely that the simulation ran. See test/README.md.
      - name: Run the test suite
        run: make test READ_REG=${{ matrix.read_reg }} ASSEMBLER=$GITHUB_WORKSPACE/QNICE-FPGA/assembler/asm

      # On a golden-file mismatch the diff is already in the job log, but the
      # full logs make it much easier to see what moved. The stats files are
      # here too because they are the other half of the comparison, and because
      # the two legs check them against different reference files.
      - name: Upload the write logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: writes-logs-read_reg-${{ matrix.read_reg }}
          path: |
            test/*.writes
            test/*.stats
          if-no-files-found: ignore
